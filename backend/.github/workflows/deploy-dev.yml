name: Dev 서버 배포

on:
  push:
    branches: [ develop ]   # develop 브랜치 push 시 dev 서버로 자동 배포
  workflow_dispatch:        # GitHub Actions 화면에서 수동 실행도 가능

# 연속으로 push 하면 이전 배포는 취소하고 마지막 것만 배포
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (실행용 jar 만)
        run: ./gradlew clean bootJar -x test

      - name: jar 파일 이름 고정
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          echo "빌드된 jar: $JAR"
          cp "$JAR" naleul.jar

      - name: dev EC2 로 jar 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "naleul.jar"
          target: "/home/ec2-user/app/deploy/incoming"

      - name: dev 서버 재시작 + 구동 확인
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ec2-user/app/deploy
            # 실행 중인 jar 를 덮어쓰지 않고 이름만 바꿔 교체 (실행 중 프로세스 보호)
            mv incoming/naleul.jar naleul.jar
            echo ">>> naleul-dev 재시작"
            sudo systemctl restart naleul-dev

            echo ">>> 구동 대기 (최대 180초)"
            for i in $(seq 1 36); do
              sleep 5
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/colors || true)
              if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
                echo ">>> 구동 완료 ($((i * 5))초, HTTP $CODE)"
                exit 0
              fi
              echo ">>> 대기중... ($((i * 5))초, HTTP $CODE)"
            done

            echo ">>> 구동 실패. 최근 로그:"
            tail -n 80 /home/ec2-user/app/logs/app.log
            exit 1
